# Nginx locations for Astro component preview behind the CMS domain.
# Replace PORT: staging=4323, production=4322
# Put these ABOVE `location /`.

location ^~ /__component-preview/ {
    proxy_pass http://127.0.0.1:PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}

# Vite may still request these at site root when base/HMR is misaligned.
location ^~ /@vite/ {
    proxy_pass http://127.0.0.1:PORT/@vite/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}

